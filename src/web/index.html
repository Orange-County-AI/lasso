<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>lasso</title>
    <!-- Apply the saved appearance mode (herdr|system|light|dark) before first
         paint so there's no flash of the wrong chrome theme. Mirrors lib/mode.ts;
         default is "herdr", which resolves to the dark class (herdr's --h-*
         override is layered on at runtime once /api/theme lands, see
         lib/theme.ts). The terminal palette is herdr's, set separately. -->
    <script>
      ;(() => {
        let m, dark
        try {
          m = localStorage.getItem("lasso-mode") || "herdr"
          dark =
            m === "dark" ||
            m === "herdr" ||
            (m !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.add(dark ? "dark" : "light")
        } catch {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
    <!-- Generated from the current L logomark by docs/icon/build.py.
         Versioned URLs retire browsers' aggressively cached old favicons. -->
    <link rel="icon" type="image/svg+xml" href="/lasso.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- Home Screen web app. iOS only delivers Web Push to a site the user has
         added to their Home Screen, and only treats it as a standalone app —
         rather than a Safari shortcut — when it declares itself one. The
         manifest is the modern route; apple-mobile-web-app-capable is the
         legacy one iOS still honors, kept because a shortcut added before this
         shipped keeps whichever mode it was created with. See lib/push.ts. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="lasso" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
