<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>lasso</title>
    <!-- The pre-paint chrome scheme. Appearance is SERVER state (three fields
         of ui_state — see lib/mode.ts), and nothing about it is readable
         before the first paint: no localStorage, and a fetch cannot be waited
         on here. So the class is the DEFAULT mode's ("herdr" → dark, matching
         DEFAULTS in lib/ui-state.ts and getUIState in db.go), and lib/mode.ts
         re-asserts it from the stored state the moment /api/ui-state lands —
         which is also when the --h-* palette override arrives. A lasso pinned
         to Light therefore opens dark for that one round trip rather than
         flashing an unstyled page. The terminal palette is herdr's, set
         separately. -->
    <!-- Generated from the current L logomark by docs/icon/build.py.
         Versioned URLs retire browsers' aggressively cached old favicons. -->
    <link rel="icon" type="image/svg+xml" href="/lasso.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <!-- Home Screen web app. iOS only delivers Web Push to a site the user has
         added to their Home Screen, and only treats it as a standalone app —
         rather than a Safari shortcut — when it declares itself one. The
         manifest is the modern route; apple-mobile-web-app-capable is the
         legacy one iOS still honors, kept because a shortcut added before this
         shipped keeps whichever mode it was created with. See lib/push.ts. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="lasso" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
