# mise tasks for lasso.
#   mise run dev    — Vite dev server (frontend HMR) proxying to the Go backend
#   mise run build  — build the frontend (src/web/dist) then the binary
#   mise run test   — run the Go tests

# Toolchain the tasks below need on PATH. go is pinned to go.mod's version so
# `mise run build`/`test`/`dev` compile with the exact toolchain (no implicit
# toolchain download); bun drives the frontend build.
#
# The bun pin has a second consumer nobody expects: it shadows the global one
# for every shell whose cwd is this repo (or a lasso worktree of it), and the
# agent CLIs lasso spawns are bun shims (`#!/usr/bin/env bun`). omp declares
# engines.bun >= 1.3.14 and dies in its own parser under anything older — so a
# stale pin here doesn't just build the frontend with an old bun, it stops an
# omp agent from booting in a lasso worktree while the same command works fine
# one directory up. Keep it at or above what the spawnable harnesses need.
[tools]
go = "1.25.3"
bun = "1.3.14"
# Renders the icon set from docs/icon/lasso.svg. It has to be resvg (or a
# browser): the glow is an feGaussianBlur, and cairosvg drops SVG filters
# silently, which yields a flat mark that looks merely wrong rather than broken.
"ubi:linebender/resvg" = "0.48.1"

[tasks.icons]
description = "Re-render the icon set, favicons and wordmark from the vector mark"
run = "./docs/icon/build.py"

[tasks."build:web"]
description = "Build the React/shadcn frontend into src/web/dist (embedded by Go)"
dir = "src/web"
run = "bun install && bun run build"

[tasks.build]
description = "Build the frontend then the lasso binary"
depends = ["build:web"]
dir = "src"
run = "go build -o ../lasso ."

[tasks.test]
description = "Run the Go test suite"
dir = "src"
run = "go test ."

[tasks.bump]
description = "Bump lassoSemver (major, minor, or patch)"
usage = '''
arg "[type]" help="Version type: major, minor, or patch" default="patch"
flag "-c --commit" help="Auto-commit after bumping"
'''
run = """
#!/usr/bin/env bash
set -e

# src/version.go holds the single source of truth: const lassoSemver = "X.Y.Z".
current=$(perl -ne 'print $1 if /lassoSemver = "([0-9]+\\.[0-9]+\\.[0-9]+)"/' src/version.go)
[ -n "$current" ] || { echo "couldn't read lassoSemver from src/version.go" >&2; exit 1; }
IFS='.' read -r major minor patch <<< "$current"

case "${usage_type}" in
  major) major=$((major + 1)); minor=0; patch=0 ;;
  minor) minor=$((minor + 1)); patch=0 ;;
  patch) patch=$((patch + 1)) ;;
  *) echo "Invalid type: ${usage_type}. Use major, minor, or patch" >&2; exit 1 ;;
esac

new_version="$major.$minor.$patch"

perl -i -pe "s/lassoSemver = \\"[0-9]+\\.[0-9]+\\.[0-9]+\\"/lassoSemver = \\"$new_version\\"/" src/version.go
echo "Bumped lassoSemver: $current → $new_version"

# Auto-commit if --commit flag is set
if [ "$usage_commit" = "true" ]; then
  git add src/version.go
  git commit -m "chore: bump version to $new_version"
  echo "Committed version bump"
fi
"""

[tasks.dev]
description = "Frontend hot reload (Vite) on the tailscale IP, proxying /api + terminals to the Go backend"
depends = ["build"]
shell = "bash -c"
run = '''
ip="$(tailscale ip -4 | head -n1)"
[ -n "$ip" ] || { echo "no tailscale IPv4 found — is tailscale up? (tailscale status)" >&2; exit 1; }

# Backend on loopback, on a dedicated DEV port (8190) — deliberately distinct
# from the production default (8090) so a dev instance never shares a port
# number with a real one, even across interfaces. With -dev it monotonically
# bumps to the next free port if 8190 is taken (e.g. a second dev instance), so
# several can run at once. We read the port it actually bound from its log and
# point Vite's proxy at that. (ttyd needs no port here: spawn mode gives each
# lasso its own per-PID unix sockets.)
logf="$(mktemp)"
./lasso -listen 127.0.0.1:8190 -insecure-no-auth -dev >"$logf" 2>&1 &
backend=$!
trap 'kill "$backend" 2>/dev/null; rm -f "$logf"' EXIT

port=""
for _ in $(seq 1 100); do
  port="$(sed -n 's#.*UI:[[:space:]]*http://127\.0\.0\.1:\([0-9][0-9]*\).*#\1#p' "$logf" | head -n1)"
  [ -n "$port" ] && break
  kill -0 "$backend" 2>/dev/null || { echo "backend exited before binding a port:" >&2; cat "$logf" >&2; exit 1; }
  sleep 0.1
done
[ -n "$port" ] || { echo "backend never reported its port; log:" >&2; cat "$logf" >&2; exit 1; }

# Surface the backend's own logs (port bumps, theme reloads) in the foreground.
tail -n +1 -f "$logf" & tailpid=$!
trap 'kill "$backend" "$tailpid" 2>/dev/null; rm -f "$logf"' EXIT

echo "lasso (dev): backend on 127.0.0.1:$port · Vite UI on http://$ip (frontend hot reload ON)"
echo "edit anything under src/web/src and the browser hot-reloads; restart this task for Go changes."
# Vite auto-bumps its own port (5173→5174→…) if busy and prints the chosen URL.
cd src/web && env LASSO_BACKEND="http://127.0.0.1:$port" bun run dev --host "$ip"
'''

[tasks.dev-luvus]
description = "Like `dev`, but the backend talks to an ISOLATED luvus release (smoke-test a Luvus version before adopting it — the prod server is never touched)"
depends = ["build"]
shell = "bash -c"
usage = '''
arg "[version]" help="luvus release to smoke-test (e.g. 0.13.4); downloaded + cached on first use" default="0.13.4"
'''
run = '''
set -euo pipefail
ver="${usage_version:-0.13.4}"; ver="${ver#v}"   # accept 0.13.4 or v0.13.4

# Map this machine to a luvus release asset (Rust target triples, tar.gz each
# holding a bare `luvus` binary, with a sibling .sha256).
case "$(uname -s)-$(uname -m)" in
  Linux-x86_64)              target=x86_64-unknown-linux-musl ;;
  Linux-aarch64|Linux-arm64) target=aarch64-unknown-linux-musl ;;
  Darwin-arm64)              target=aarch64-apple-darwin ;;
  Darwin-x86_64)             target=x86_64-apple-darwin ;;
  *) echo "dev-luvus: unsupported platform $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac
asset="luvus-v$ver-$target.tar.gz"

# Isolated home: LUVUS_HOME is the ONE switch that moves a Luvus server's whole
# world — its socket, session state, themes, manifests and logs all live under
# it — so this daemon shares nothing with the production one (~/.luvus). The
# prod server is never read or written, so a regression in the version under
# test can't corrupt real sessions.
home="${TMPDIR:-/tmp}/lasso-luvus-smoke/$ver"
bin="$home/luvus"
# Inherited pane endpoints outrank LUVUS_HOME. Clear them BEFORE any server
# command, including the exit trap, or a smoke run could stop production.
unset LUVUS_ENV LUVUS_PANE_ID LUVUS_SOCKET_PATH LUVUS_API_ADDRESS LUVUS_BIN_PATH LUVUS_SESSION LUVUS_WORKSPACE_ID LUVUS_TAB_ID
export LUVUS_HOME="$home/luvus-home"
mkdir -p "$home" "$LUVUS_HOME"

# Cache the binary across runs; download + verify on first use.
if [ ! -x "$bin" ]; then
  echo "dev-luvus: downloading luvus $ver ($asset) …"
  base="https://github.com/RizRiyz/luvus/releases/download/v$ver"
  curl -fsSL -o "$home/$asset" "$base/$asset"
  curl -fsSL -o "$home/$asset.sha256" "$base/luvus-v$ver-$target.sha256"
  want="$(awk '{print $1; exit}' "$home/$asset.sha256")"
  got="$( { sha256sum "$home/$asset" 2>/dev/null || shasum -a 256 "$home/$asset"; } | awk '{print $1}')"
  [ "$want" = "$got" ] || { echo "dev-luvus: checksum mismatch for $asset (want $want, got $got)" >&2; exit 1; }
  tar xzf "$home/$asset" -C "$home" luvus
  chmod +x "$bin"
fi
echo "dev-luvus: $("$bin" --version | head -n1) at $bin"

# Start the isolated server and tear it down on exit. The bare `luvus server` is
# the FOREGROUND server (`server start` daemonizes and reparents itself, which a
# trap can't reliably reclaim), and it binds inside LUVUS_HOME, so starting it
# from inside a prod pane does not disturb prod panes.
"$bin" server >"$home/server.log" 2>&1 &
lpid=$!
stop_luvus() { "$bin" server stop >/dev/null 2>&1 || true; kill "$lpid" 2>/dev/null || true; }
trap stop_luvus EXIT INT TERM

# Ask Luvus where it bound rather than assuming $LUVUS_HOME/luvus.sock: an
# over-long home makes it bind a short alias in the temp root instead, and
# session.list is the only thing that knows. It is a host-profile method, so it
# answers before the server is up (running:false) — poll until it says running.
# An isolated home holds exactly one session, so reading the single address out
# of the reply needs nothing but sed.
sock=""
for _ in $(seq 1 100); do
  reply="$(printf '{"id":"1","method":"session.list","params":{}}\n' | "$bin" uhp proxy 2>/dev/null || true)"
  case "$reply" in
    *'"running":true'*) sock="$(printf '%s' "$reply" | sed -n 's/.*"address":"\([^"]*\)".*/\1/p')" ;;
  esac
  [ -n "$sock" ] && break
  kill -0 "$lpid" 2>/dev/null || { echo "dev-luvus: isolated luvus exited:" >&2; cat "$home/server.log" >&2; exit 1; }
  sleep 0.1
done
[ -n "$sock" ] || { echo "dev-luvus: isolated luvus never came up:" >&2; cat "$home/server.log" >&2; exit 1; }
export LUVUS_SOCKET_PATH="$sock"
export LUVUS_API_ADDRESS="$sock"
export LUVUS_BIN_PATH="$bin"
echo "dev-luvus: isolated luvus $ver on $sock (log: $home/server.log)"

# Put the isolated binary first on PATH so lasso's terminal tab (-term-cmd luvus,
# default) opens THIS version's TUI. It inherits LUVUS_HOME, so the TUI attaches
# to the isolated server rather than prod.
export PATH="$home:$PATH"

# ---- below mirrors `dev`, except defaultSock() now resolves to the isolated
# ---- LUVUS_SOCKET_PATH, so the backend drives luvus $ver instead of prod. ----
ip="$(tailscale ip -4 | head -n1)"
[ -n "$ip" ] || { echo "no tailscale IPv4 found — is tailscale up? (tailscale status)" >&2; exit 1; }

logf="$(mktemp)"
./lasso -listen 127.0.0.1:8190 -insecure-no-auth -dev >"$logf" 2>&1 &
backend=$!
trap 'stop_luvus; kill "$backend" 2>/dev/null; rm -f "$logf"' EXIT INT TERM

port=""
for _ in $(seq 1 100); do
  port="$(sed -n 's#.*UI:[[:space:]]*http://127\.0\.0\.1:\([0-9][0-9]*\).*#\1#p' "$logf" | head -n1)"
  [ -n "$port" ] && break
  kill -0 "$backend" 2>/dev/null || { echo "backend exited before binding a port:" >&2; cat "$logf" >&2; exit 1; }
  sleep 0.1
done
[ -n "$port" ] || { echo "backend never reported its port; log:" >&2; cat "$logf" >&2; exit 1; }

tail -n +1 -f "$logf" & tailpid=$!
trap 'stop_luvus; kill "$backend" "$tailpid" 2>/dev/null; rm -f "$logf"' EXIT INT TERM

echo "lasso (dev-luvus $ver): backend 127.0.0.1:$port → luvus $ver ($sock) · Vite UI http://$ip"
echo "Settings tab should read luvus $ver / the UHP protocol that server reports / compatible. Ctrl-C stops lasso AND the isolated server."
cd src/web && env LASSO_BACKEND="http://127.0.0.1:$port" bun run dev --host "$ip"
'''
