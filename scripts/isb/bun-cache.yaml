# Overlay: bun's global download cache as a named incus volume shared by every
# dev container, so a new worktree's first `bun install` is ~30-40s instead of a
# cold ~600 MiB download. Content-addressed and written tmp-then-rename, so
# sharing is safe for correctness; it is also a channel between worktrees (see
# container.sh). container.sh leaves this file out when LASSO_DEV_BUN_CACHE is
# set empty, which is the opt-out.
volumes:
  bun-cache:
    name: "${LASSO_DEV_BUN_CACHE}"
services:
  web:
    volumes:
      # A fresh volume's root is container-root owned, and so are the ~/.bun
      # parents the mount conjures; owner=dev has isb chown them all to dev.
      - bun-cache:/home/dev/.bun/install/cache:device=bun-cache,owner=dev
